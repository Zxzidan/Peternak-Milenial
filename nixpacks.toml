# nixpacks.toml - Konfigurasi build Railway untuk Laravel + PHP 8.4

[phases.setup]
nixPkgs = [
    "php84",
    "php84Packages.composer",
    "php84Extensions.pdo_mysql",
    "php84Extensions.mbstring",
    "php84Extensions.openssl",
    "php84Extensions.bcmath",
    "php84Extensions.curl",
    "php84Extensions.fileinfo",
    "php84Extensions.tokenizer",
    "php84Extensions.xml",
    "php84Extensions.zip",
    "nodejs_22"
]

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci --ignore-scripts || npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
